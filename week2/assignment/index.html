<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <!-- 헤더 -->
      <span class="header-icon">🫡</span>
      <h1 class="header-title">웹계인 관리 페이지</h1>
      <span class="header-detail">DIVE SOPT 37기 OB 임지성</span>
    </header>
    <div class="filter-container">
      <!-- 검색 필터 -->
      <h2 class="filter-title">검색 필터</h2>
      <form action="" class="filter-form">
        <div class="filter-grid">
          <!-- TODO: span을 label 태그로 변경 -->
          <div class="filter-item">
            <span class="filter-name">이름</span>
            <input
              type="text"
              placeholder="이름을 입력하세요"
              class="filter-input"
            />
          </div>

          <div class="filter-item">
            <span class="filter-name">영문이름</span>
            <input
              type="text"
              placeholder="영문 이름을 입력하세요"
              class="filter-input"
            />
          </div>

          <div class="filter-item">
            <span class="filter-name">깃허브</span>
            <input
              type="text"
              placeholder="깃허브 아이디를 입력하세요"
              class="filter-input"
            />
          </div>

          <div class="filter-item">
            <span class="filter-name">성별</span>
            <select name="" id="" class="filter-select">
              <option value="male">남자</option>
              <option value="female">여자</option>
            </select>
          </div>

          <div class="filter-item">
            <span class="filter-name">역할</span>
            <select name="" id="" class="filter-select">
              <option value="OB">OB</option>
              <option value="YB">YB</option>
            </select>
          </div>

          <div class="filter-item">
            <span class="filter-name">금잔디조</span>
            <input
              type="number"
              placeholder="금잔디조를 입력하세요 (1~9)"
              class="filter-input"
            />
          </div>

          <div class="filter-item">
            <span class="filter-name">나이</span>
            <input
              type="number"
              placeholder="나이를 입력하세요"
              class="filter-input"
            />
          </div>
        </div>

        <div class="filter-button-container">
          <button type="submit" class="filter-button">적용</button>
          <button type="reset" class="filter-button">초기화</button>
        </div>
      </form>
    </div>

    <!-- 검색 결과 -->
    <div class="member-list-container">
      <h2 class="member-list-title">37기 웹 파트원 목록</h2>

      <div class="list-modify-button-container">
        <!-- 선택 삭제 / 추가 버튼 -->
        <button type="button" class="list-modify-button">선택 삭제</button>
        <button type="button" class="list-modify-button">추가</button>
      </div>

      <table class="table">
        <colgroup>
          <!-- colgroup에서 너비 설정은 inline style로 정의가 효율적일 듯함 -->
          <!-- css 별도 분리 시 :nth-child로 코드가 복잡해짐 -->
          <col style="width: 10%" />
          <col style="width: 10%" />
          <col style="width: 20%" />
          <col style="width: 20%" />
          <col style="width: 10%" />
          <col style="width: 10%" />
          <col style="width: 10%" />
          <col style="width: 10%" />
        </colgroup>
        <thead>
          <tr class="table-header-row">
            <th class="table-header">
              <input type="checkbox" name="" id="" />
            </th>
            <th class="table-header">이름</th>
            <th class="table-header">영문 이름</th>
            <th class="table-header">깃허브</th>
            <th class="table-header">성별</th>
            <th class="table-header">역할</th>
            <th class="table-header">금잔디조</th>
            <th class="table-header">나이</th>
          </tr>
        </thead>
        <tbody class="member-list-item"></tbody>
      </table>
    </div>

    <!-- 모달창 -->
    <div class="modal-background">
      <div class="modal-content">
        <div class="modal-header-container">
          <h2 class="modal-header">멤버 추가</h2>
          <button type="button" class="close-modal-button">X</button>
        </div>

        <div class="modal-input-container">
          <div class="modal-input-box">
            <label for="member-name" class="modal-input-label">이름</label>
            <input
              type="text"
              id="member-name"
              class="modal-input"
              placeholder="이름을 입력해주세요"
            />
          </div>
          <div class="modal-input-box">
            <label for="member-english-name" class="modal-input-label">영문 이름</label>
            <input
              type="text"
              id="member-english-name"
              class="modal-input"
              placeholder="영문 이름을 입력해주세요"
            />
          </div>
          <div class="modal-input-box">
            <label for="member-github" class="modal-input-label">깃허브 아이디</label>
            <input
              type="text"
              id="member-github"
              class="modal-input"
              placeholder="깃허브 아이디를 입력해주세요"
            />
          </div>
          <div class="input-box-wrapper">
            <div class="modal-input-box">
              <label for="member-gender" class="modal-input-label">성별</label>
              <select name="gender" id="member-gender" class="modal-select">
                <option value="">선택</option>
                <option value="male">남자</option>
                <option value="female">여자</option>
              </select>
            </div>
            <div class="modal-input-box">
              <label for="member-role" class="modal-input-label">역할</label>
              <select name="role" id="member-role" class="modal-select">
                <option value="">선택</option>
                <option value="OB">OB</option>
                <option value="YB">YB</option>
              </select>
            </div>
          </div>
          <div class="input-box-wrapper">
            <div class="modal-input-box">
              <label for="member-team" class="modal-input-label">금잔디조</label>
              <input
                type="number"
                id="member-team"
                class="modal-input"
                placeholder="금잔디조를 입력해주세요"
                min="1"
                max="9"
              />
            </div>
            <div class="modal-input-box">
              <label for="member-age" class="modal-input-label">나이</label>
              <input
                type="number"
                id="member-age"
                class="modal-input"
                placeholder="나이를 입력해주세요"
              />
            </div>
          </div>
        </div>

        <div class="modal-button-container">
          <button type="button" class="modal-add-member-button">추가</button>
        </div>
      </div>
    </div>
  </body>
</html>
