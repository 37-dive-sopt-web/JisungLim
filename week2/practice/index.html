<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button type="button" onClick="onClick3()">리스트 추가하기</button>
    <ul id="ul"></ul>
  </body>

  <script>
    const onClick = () => {
      const ul = document.getElementById("ul");

      // 1 ~ 3000까지의 숫자 리스트가 화면에 출력되게 해보자(반복문 사용)
      for (let i = 1; i <= 3000; i++) {
        // 1. ul에 추가할 element 생성
        const listItem = document.createElement("li");

        // 2. contents 추가
        listItem.textContent = `${i}`;

        // 3. ul에 appendChild()
        ul.appendChild(listItem); 
        // appendChild는 HTML 태그를 문자열로 직접 추가해서 받을 수 없음
      }
    };

    // 나쁜 예시
    const onClick2 = () => {
      const ul = document.getElementById("ul");

      for (let i = 1; i <= 3000; i++) {
        const listItem = `<li>${i}</li>`;
        ul.innerHTML += listItem;
      }
    };

    // 좋은 예시
    const onClick3 = () => {
      const ul = document.getElementById("ul");
      let list = "";

      for (let i = 1; i <= 3000; i++) {
        list += `<li>${i}</li>`;
      }

      ul.innerHTML = list;
    };
  </script>
</html>
